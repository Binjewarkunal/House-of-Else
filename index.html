<style>
:root{--ink:#0e0c0a;--ink2:#181510;--cream:#f4eedf;--mut:#a39a86;--gold:#e2b23c;--line:rgba(244,238,223,.13);--d:'Anton','Impact','Arial Narrow',sans-serif;--b:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;color-scheme:dark;box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}html{scroll-behavior:smooth;scroll-padding-top:90px}
body{margin:0;background:var(--ink);color:var(--cream);font:400 17px/1.6 var(--b);overflow-x:hidden;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}a{color:inherit}button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.w{width:min(1180px,100% - 40px);margin-inline:auto}section{padding:84px 0}
h1,h2,h3{font-family:var(--d);font-weight:400;text-transform:uppercase;line-height:.98;letter-spacing:.005em;margin:0}
h2{font-size:clamp(2.3rem,5.6vw,4.2rem);max-width:16ch}h2 em,h1 em{font-style:normal;color:var(--gold)}
.k{display:inline-block;font-weight:600;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:14px}
.lead{color:var(--mut);max-width:58ch;font-size:1.08rem}
.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 24px;border-radius:999px;border:1.5px solid var(--line);font-weight:600;text-decoration:none;transition:transform .25s,background .25s,box-shadow .25s;background:none}
.btn.g{background:var(--gold);border-color:var(--gold);color:#17110a}.btn.g:hover{transform:translateY(-3px);box-shadow:0 14px 30px -12px var(--gold)}
.btn.o:hover{background:rgba(244,238,223,.08);transform:translateY(-3px)}
#ld{position:fixed;inset:0;z-index:999;background:var(--ink);display:grid;place-content:center;justify-items:center;gap:22px;transition:opacity .6s,visibility .6s}
#ld img{width:min(280px,64vw);animation:pop .9s cubic-bezier(.2,.9,.3,1.2) both}#ld i{width:150px;height:3px;background:var(--line);position:relative;overflow:hidden}
#ld i::after{content:"";position:absolute;inset:0;background:var(--gold);transform:translateX(-100%);animation:ld 1.3s .2s ease forwards}#ld.x{opacity:0;visibility:hidden}
@keyframes pop{from{opacity:0;transform:scale(.7) rotate(-4deg)}}@keyframes ld{to{transform:none}}
#ann{background:var(--gold);color:#17110a;text-align:center;font-weight:600;font-size:.92rem;padding:9px 40px;padding-top:calc(9px + env(safe-area-inset-top,0px));position:relative}
#ann a{text-decoration:underline;text-underline-offset:3px}#ann button{position:absolute;right:12px;top:calc(4px + env(safe-area-inset-top,0px));border:0;background:none;font-size:1.1rem;color:#17110a;padding:4px 8px}
nav{position:sticky;top:0;z-index:50;background:rgba(14,12,10,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
nav .w{display:flex;align-items:center;gap:26px;height:68px}nav .lg{height:42px;width:auto}nav ul{display:flex;gap:24px;list-style:none;margin:0 auto 0 14px;padding:0}
nav ul a{text-decoration:none;color:var(--mut);font-weight:500;font-size:.95rem}nav ul a:hover{color:var(--cream)}nav .btn{padding:10px 18px;font-size:.9rem}
.hero{padding:56px 0 30px;position:relative;overflow:hidden}.hero::before{content:"";position:absolute;width:560px;height:560px;right:-160px;top:-120px;border-radius:50%;background:radial-gradient(closest-side,rgba(226,178,60,.28),transparent)}
.hero .w{display:grid;grid-template-columns:1.2fr .8fr;gap:40px;align-items:center;position:relative}
.pill{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:999px;padding:7px 16px 7px 12px;font-size:.88rem;color:var(--mut);margin-bottom:22px}.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:#5fd08a;box-shadow:0 0 0 4px rgba(95,208,138,.2)}
h1{font-size:clamp(3.3rem,9vw,7.4rem)}.hero .lead{margin:24px 0 32px}.cta{display:flex;flex-wrap:wrap;gap:12px}
.col{position:relative;height:460px}.pc{position:absolute;width:74%;border-radius:20px;overflow:hidden;background:var(--ink2);border:1px solid var(--line);box-shadow:0 30px 60px -28px #000;aspect-ratio:1.3/1;transition:transform .5s}
.pc img{width:100%;height:100%;object-fit:cover;object-position:top}.pc:nth-child(1){left:0;top:10px;transform:rotate(-5deg)}.pc:nth-child(2){right:0;top:135px;transform:rotate(4deg);z-index:2}.pc:nth-child(3){left:6%;bottom:0;transform:rotate(-2deg);z-index:3}
.pc:hover{transform:rotate(0) scale(1.04);z-index:5}.pc span{position:absolute;left:10px;bottom:10px;background:var(--cream);color:#17110a;font-weight:700;font-size:.82rem;padding:6px 12px;border-radius:999px}
.tk{margin-top:44px;border-block:1px solid var(--line);overflow:hidden;white-space:nowrap}.tk div{display:inline-block;padding:14px 0;animation:tk 32s linear infinite;font:400 1.5rem var(--d);text-transform:uppercase;color:var(--mut)}.tk b{color:var(--gold);margin:0 22px;font-weight:400}@keyframes tk{to{transform:translateX(-50%)}}
.st{display:grid;grid-template-columns:repeat(4,1fr);padding:36px 0}.st div{padding:6px 24px;border-left:1px solid var(--line)}.st div:first-child{border:0;padding-left:0}.st strong{display:block;font:400 clamp(2.4rem,5vw,3.8rem)/1 var(--d);color:var(--gold)}.st span{color:var(--mut);font-size:.95rem}
.sv{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:44px}.sv div{background:var(--ink2);border:1px solid var(--line);border-radius:24px;padding:28px 24px;transition:transform .3s,border-color .3s}.sv div:hover{transform:translateY(-6px);border-color:var(--gold)}
.sv i{font:400 2.6rem/1 var(--d);color:var(--gold);font-style:normal}.sv h3{font-size:1.5rem;margin:16px 0 10px}.sv p{color:var(--mut);font-size:.96rem;margin:0}
.bn{margin-top:18px;border-radius:24px;background:var(--gold);color:#17110a;padding:26px 30px;display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap}.bn p{margin:0;font-weight:600;max-width:60ch}.bn .btn{background:#17110a;border-color:#17110a;color:var(--cream)}
.ind{background:var(--ink2);border-block:1px solid var(--line)}.ind .w{display:grid;grid-template-columns:1fr 1fr;gap:50px;align-items:center}.chips{display:flex;flex-wrap:wrap;gap:10px}
.chips span,.f button{border:1px solid var(--line);border-radius:999px;padding:9px 18px;font-weight:500;font-size:.95rem;background:none;transition:.2s}.chips span:hover{border-color:var(--gold);color:var(--gold)}
.pf{display:grid;gap:14px}.pf div{border:1px solid var(--line);border-radius:20px;padding:20px 24px}.pf h3{font-size:1.4rem;margin-bottom:6px}.pf p{margin:0;color:var(--mut);font-size:.95rem}
.pl{display:flex;align-items:center;gap:12px;margin-top:26px;color:var(--mut);font-size:.9rem}.pl img{width:32px;height:32px;border-radius:8px}.pf div{display:flex;gap:16px;align-items:center}.pf img{width:46px;height:46px;flex:none;border-radius:12px}.wk{border:1px solid var(--line);border-radius:28px;padding:36px;background:linear-gradient(120deg,#1d1810,var(--ink2));display:grid;grid-template-columns:1.4fr .6fr;gap:30px;align-items:center}.wk h3{font-size:clamp(2rem,4.5vw,3.4rem);color:var(--gold);margin-bottom:14px}.wk p{margin:0;color:var(--mut);max-width:60ch}.wc{display:grid;gap:10px}.wc span{border:1px solid var(--line);border-radius:999px;padding:10px 18px;font-weight:600;font-size:.9rem;text-align:center}.sq{aspect-ratio:1/1.02!important}.nt{background:rgba(226,178,60,.1);border:1px solid rgba(226,178,60,.4);border-radius:18px;padding:16px 20px;margin-bottom:22px;max-width:70ch}.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:26px}.hd .lead{margin-top:14px}
.sr{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}.sr input{flex:1 1 260px;background:var(--ink2);border:1px solid var(--line);border-radius:999px;padding:13px 20px;color:var(--cream);font:inherit}
.f{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:24px;scrollbar-width:none}.f button{white-space:nowrap;color:var(--mut)}.f button.on,.f button:hover{background:var(--cream);border-color:var(--cream);color:#17110a}
.gr{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.cd{background:var(--ink2);border:1px solid var(--line);border-radius:22px;overflow:hidden;transition:transform .3s,border-color .3s;animation:in .5s both}.cd:hover{transform:translateY(-6px);border-color:var(--gold)}@keyframes in{from{opacity:0;transform:translateY(16px)}}
.sh{display:block;position:relative;aspect-ratio:1.3/1;overflow:hidden;background:#241f17}.sh img{width:100%;height:100%;object-fit:cover;object-position:top;transition:transform .6s}.cd:hover .sh img{transform:scale(1.05)}
.ph{position:absolute;inset:0;display:grid;place-items:center;font:400 3.6rem var(--d);color:var(--gold);background:linear-gradient(150deg,#2a2217,#14110c)}
.ov{position:absolute;inset:auto 0 0;padding:44px 14px 12px;background:linear-gradient(transparent,rgba(14,12,10,.92))}.ov h3{font-size:1.25rem}.ov em{font-style:normal;color:var(--mut);font-size:.8rem}
.ft{padding:14px 14px 16px}.ft>div{display:flex;justify-content:space-between;gap:8px;align-items:center}.ft h3{font-size:1.2rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ft small{display:block;color:var(--mut);font-size:.82rem;margin-top:3px}.ft a{color:inherit;text-decoration:none}.ft a:hover{color:var(--gold)}.ft b{background:var(--gold);color:#17110a;border-radius:999px;font-size:.78rem;padding:3px 10px}
.ft p{margin:9px 0 0;display:flex;flex-wrap:wrap;gap:6px}.ft p span{font-size:.74rem;border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--mut)}
.mr{text-align:center;margin-top:30px}.em{color:var(--mut);text-align:center;padding:40px 0;grid-column:1/-1}
.sc{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 2px 14px;scrollbar-width:thin}.mn{flex:0 0 270px;scroll-snap-align:start;display:flex;gap:12px;align-items:center;background:var(--ink2);border:1px solid var(--line);border-radius:18px;padding:10px;text-decoration:none;transition:border-color .2s}.mn:hover{border-color:var(--gold)}
.mn .t{flex:0 0 72px;height:72px;border-radius:14px;overflow:hidden;position:relative;background:#241f17}.mn .t img{width:100%;height:100%;object-fit:cover;object-position:left top}.mn .ph{font-size:1.5rem}.mn strong{display:block;line-height:1.2}.mn small{color:var(--mut);display:block}.mn em{font-style:normal;color:var(--gold);font-weight:600;font-size:.88rem}
.sp{font-weight:500;color:var(--mut);margin:4px 0 14px}.sp b{color:var(--gold)}
.tm{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:34px}.tm div{display:flex;gap:16px;align-items:center;border:1px solid var(--line);border-radius:22px;padding:18px;background:var(--ink2)}
.tm .ph{position:relative;flex:0 0 76px;height:76px;border-radius:50%;overflow:hidden;font-size:1.8rem}.tm img{flex:0 0 76px;height:76px;border-radius:50%;object-fit:cover}.tm h3{font-size:1.2rem}.tm small{color:var(--mut);display:block;line-height:1.35;margin:4px 0}.tm a{color:var(--gold);font-weight:600;font-size:.88rem}
.ct{background:var(--gold);color:#17110a;border-radius:36px;padding:56px;width:min(1180px,100% - 24px);margin-inline:auto;display:grid;grid-template-columns:.9fr 1.1fr;gap:50px}
.ct h2{max-width:11ch;color:#17110a}.ct p{max-width:40ch}.ct ul{list-style:none;padding:0;margin:24px 0}.ct li{padding:7px 0;border-top:1px solid rgba(23,17,10,.2)}.ct li a{font-weight:600}.ct .btn.o{border-color:#17110a}
form{display:grid;gap:12px}.r2{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-size:.82rem;font-weight:600}input,select,textarea{width:100%;background:rgba(255,255,255,.55);border:1.5px solid transparent;border-radius:14px;padding:13px 14px;font:inherit;color:#17110a;margin-top:5px}
input:focus,select:focus,textarea:focus{outline:0;border-color:#17110a;background:#fff}textarea{min-height:104px;resize:vertical}form .btn.g{background:#17110a;border-color:#17110a;color:var(--cream)}small.n{opacity:.7}
footer{padding:44px 0 36px;margin-top:80px;border-top:1px solid var(--line);color:var(--mut);font-size:.9rem}footer .w{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:center}footer img{height:44px;width:auto}footer a{margin-right:18px;text-decoration:none}footer a:hover{color:var(--gold)}
#md{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.72);display:none;place-items:center;padding:20px}#md.on{display:grid}#md div{background:var(--cream);color:#17110a;border-radius:30px;padding:38px;max-width:460px;position:relative;animation:pop .5s both}
#md h3{font-size:2.3rem;margin-bottom:12px}#md p{margin:0 0 22px}#md button{position:absolute;right:14px;top:10px;border:0;background:none;font-size:1.5rem}#md .btn{background:#17110a;border-color:#17110a;color:var(--cream)}
.rv{opacity:0;transform:translateY(24px);transition:opacity .8s,transform .8s}.rv.in{opacity:1;transform:none}
@media(max-width:900px){.wk{grid-template-columns:1fr;padding:26px}section{padding:64px 0}nav ul{display:none}nav .btn.o{display:none}nav .btn.g{margin-left:auto}.hero .w,.ind .w,.ct{grid-template-columns:1fr}.col{height:380px;max-width:420px;margin:0 auto;width:100%}.sv,.gr{grid-template-columns:1fr 1fr}.tm{grid-template-columns:1fr}.ct{padding:34px 22px}.st{grid-template-columns:1fr 1fr}.st div:nth-child(odd){border:0;padding-left:0}.st div:nth-child(n+3){border-top:1px solid var(--line);margin-top:14px;padding-top:20px}}
@media(max-width:520px){.gr{gap:12px}.sv{grid-template-columns:1fr}.r2{grid-template-columns:1fr}h1{font-size:3.2rem}.mn{flex-basis:240px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}#ld{display:none}}
.sh{aspect-ratio:8/7!important;background:#0f141a}.sh img{object-fit:cover!important;object-position:top!important}.cd:hover .sh img{transform:none!important}.pc,.sq{aspect-ratio:8/7!important}.cd{display:flex;flex-direction:column}.ft{flex:1}.ft h3{white-space:normal!important;overflow:visible!important;text-overflow:clip!important;font-size:1.1rem;line-height:1.14;margin-bottom:9px;overflow-wrap:anywhere}.ft .mt{gap:10px;align-items:flex-start}.ft .mt a,.ft .mt span{overflow-wrap:anywhere;font-size:.86rem;color:var(--mut)}.ft .mt b{flex:none}.sc .cd{flex:0 0 250px;scroll-snap-align:start}.gr{align-items:stretch}@media(max-width:520px){.ft .mt{flex-direction:column;gap:8px}.ft .mt a,.ft .mt span{font-size:.8rem;overflow-wrap:break-word;word-break:break-all}.ft h3{font-size:1rem}.ft{padding:12px 12px 14px}}</style>
</head>
